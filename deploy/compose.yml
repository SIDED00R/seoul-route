# 루트 .env와 로컬에서 생성한 OTP 그래프를 사용하는 공용 스택.
services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: seoul
      POSTGRES_PASSWORD: seoul
      POSTGRES_DB: seoul_route
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoul -d seoul_route"]
      interval: 10s
      timeout: 5s
      retries: 5

  otp:
    image: opentripplanner/opentripplanner:2.10.0
    restart: unless-stopped
    command: ["--load"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4G"
    volumes:
      - ../otp/graph.obj:/var/opentripplanner/graph.obj:ro
      - ./otp/router-config.json:/var/opentripplanner/router-config.json:ro # GBFS url 이 api 서비스명인 Compose 전용본
      - ../otp/otp-config.json:/var/opentripplanner/otp-config.json:ro
    ports:
      - "127.0.0.1:8080:8080" # 호스트 loopback만. 외부 공개 시에는 TLS 역방향 프록시 뒤에 둔다.
    mem_limit: 5g

  api:
    build:
      context: ../backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown} # deploy/release.ps1 이 현재 커밋을 넣는다. /health version 으로 나간다
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://seoul:seoul@postgres:5432/seoul_route?sslmode=disable
      OTP_URL: http://otp:8080
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-} # 운영은 실제 개인 계정만. 비면 모든 계정 허용(기동 로그 경고). 개발 스택은 compose.dev.yml
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:-} # 비면 GBFS 비활성(/gbfs 503) — 따릉이 라우팅이 죽는다
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-} # 비면 /places/search 503
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}         # 비면 /tiles 503
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}                     # 비면 버스 첫 탑승 실시간 보정 없음
      SEOUL_SUBWAY_REALTIME_KEY: ${SEOUL_SUBWAY_REALTIME_KEY:-} # 비면 지하철 첫 탑승 실시간 보정 없음
      GTFS_ZIP: /data/seoul-gtfs.zip                          # 버스 배차간격 표시용(아래 마운트)
      CROSSINGS_CSV: /data/crossings.csv                      # 신호 횡단보도 대기 반영용(아래 마운트, 없으면 미반영)
      FAST_EXIT_JSON: /data/fast-exit.json                    # 지하철 하차 칸 표시용(아래 마운트, cmd/fastexit 산출)
      ESCALATOR_JSON: /data/escalator.json                    # 에스컬레이터 운행방향(아래 마운트, 없으면 계단만)
      PUBLIC_URL: http://api:8081               # OTP 컨테이너가 GBFS 하위 feed URL 을 이 주소로 받는다
      PORT: "8081"
    volumes:
      # 선택 데이터 파일이 없어도 빈 디렉터리가 생기지 않도록 상위 디렉터리를 마운트한다.
      - ../otp/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081" # 평문 HTTP를 외부에 열지 않는다. 외부 공개 시에는 TLS 역방향 프록시를 둔다.

volumes:
  pgdata:
