# 개발 스택. 운영 스택(compose.yml)과 같은 PC 에서 나란히 돈다 — 프로젝트명·DB 볼륨·포트가 다르고 .env.dev 를 읽는다.
#   docker compose --env-file .env.dev -f deploy/compose.dev.yml up -d
# 그래프·데이터는 운영과 같은 otp/ 를 읽기 전용으로 공유한다(OTP_DIR 로 다른 곳을 가리킬 수 있다).
# 운영 스택은 그대로 두고 여기서만 테스트하면 실제 계정 데이터에 아무것도 섞이지 않는다.
name: seoul-route-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: seoul
      POSTGRES_PASSWORD: seoul
      POSTGRES_DB: seoul_route
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # 호스트에서 개발 DB 를 직접 보고, 백엔드 통합 테스트(TEST_DATABASE_URL)에도 쓴다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seoul -d seoul_route"]
      interval: 10s
      timeout: 5s
      retries: 5

  otp:
    image: opentripplanner/opentripplanner:2.10.0
    restart: unless-stopped
    command: ["--load"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4G"
    volumes:
      - ${OTP_DIR:-../otp}/graph.obj:/var/opentripplanner/graph.obj:ro
      - ./otp/router-config.json:/var/opentripplanner/router-config.json:ro # GBFS url 이 api 서비스명(이 스택 안의 api)
      - ${OTP_DIR:-../otp}/otp-config.json:/var/opentripplanner/otp-config.json:ro
    ports:
      - "127.0.0.1:8083:8080"
    mem_limit: 5g

  api:
    build:
      context: ../backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown} # deploy/release.ps1 이 현재 커밋을 넣는다. /health version 으로 나간다
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://seoul:seoul@postgres:5432/seoul_route?sslmode=disable
      OTP_URL: http://otp:8080
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-} # 테스트 Google 계정만. 비면 모든 계정 허용(기동 로그 경고)
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      SEOUL_SUBWAY_REALTIME_KEY: ${SEOUL_SUBWAY_REALTIME_KEY:-}
      GTFS_ZIP: /data/seoul-gtfs.zip
      CROSSINGS_CSV: /data/crossings.csv
      FAST_EXIT_JSON: /data/fast-exit.json
      ESCALATOR_JSON: /data/escalator.json
      PUBLIC_URL: http://api:8081
      PORT: "8081"
    volumes:
      - ${OTP_DIR:-../otp}/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8081" # 앱 dev flavor 기본 주소(에뮬레이터 http://10.0.2.2:8082)

volumes:
  pgdata-dev:
